<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wondooseo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0d1117;
      color: #c9d1d9;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 1.8rem;
      color: #58a6ff;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1.1rem;
      color: #8b949e;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.35rem 0.8rem;
      border-radius: 20px;
      background-color: #21262d;
      border: 1px solid #30363d;
      font-size: 0.9rem;
      color: #7ee787;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>wondooseo.github.io</h1>
    <p>I hate html</p>
    <div class="badge">🚀 GitHub Pages 배포 완료!</div>
  </div>
</body>
</html>
